<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#1769e0">
	<meta http-equiv="refresh" content="1;url=https://play.google.com/store/search?q=Call%20Spam%20Blocker%20by%20Sojiha&amp;c=apps">
	<title>Call Spam Blocker — Google Play</title>
	<style>
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			padding: 24px;
			display: grid;
			place-items: center;
			color: #172033;
			background: #f4f7fc;
			font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		main {
			width: min(100%, 440px);
			padding: 40px 30px;
			text-align: center;
			background: #fff;
			border: 1px solid #e6ebf3;
			border-radius: 20px;
			box-shadow: 0 12px 36px rgb(23 32 51 / 8%);
		}
		h1 { margin: 0 0 10px; font-size: 26px; }
		p { margin: 0 0 24px; color: #5d687b; }
		a {
			display: inline-block;
			padding: 12px 22px;
			color: #fff;
			background: #1769e0;
			border-radius: 10px;
			font-weight: 650;
			text-decoration: none;
		}
		a:hover { background: #1056bd; }
		a:focus-visible { outline: 3px solid #92baff; outline-offset: 3px; }
	</style>
</head>
<body>
	<main>
		<h1>Call Spam Blocker</h1>
		<p>Redirecting you to Google Play. If you are not redirected, continue using the button below.</p>
		<a href="https://play.google.com/store/apps/details?id=com.sojiha.callspammerblocker">Continue to Google Play</a>
	</main>
	<script>
		window.location.replace('https://play.google.com/store/apps/details?id=com.sojiha.callspammerblocker');
	</script>
</body>
</html>
